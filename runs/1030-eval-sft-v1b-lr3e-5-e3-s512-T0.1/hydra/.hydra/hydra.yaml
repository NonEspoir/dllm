hydra:
  run:
    dir: /root/autodl-tmp/dllm/runs/1030-eval-sft-v1b-lr3e-5-e3-s512-T0.1/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/root/autodl-tmp/dllm/runs/1030-eval-sft-v1b-lr3e-5-e3-s512-T0.1/hydra
    - hydra.mode=RUN
    task:
    - mode=gsm8k_eval
    - seed=1
    - eval.checkpoint_path=/root/autodl-tmp/sft_ckpt/1030-sft-v1b-lr3e-5/epoch3.ckpt
    - data=gsm8k-test
    - data.data_path=/root/autodl-tmp/data/gsm8k_dev.json
    - data.cache_dir=/root/autodl-tmp/data_cache/gsm8k_dev
    - data.tokenizer_name_or_path=HuggingFaceTB/SmolLM-135M
    - model=small
    - model.length=512
    - algo=mdlm
    - sampler=fast_ancestral
    - sampler.steps=512
    - sampler.temperature=0.1
    - loader.eval_batch_size=200
    - loader.num_workers=4
    - trainer.num_nodes=1
    - trainer.devices=1
    - gsm8k.output_dir=/root/autodl-tmp/dllm/runs/1030-eval-sft-v1b-lr3e-5-e3-s512-T0.1
    - gsm8k.bootstrap_size=1000
    - +wandb.offline=True
    - sampler.skip_unchanged=true
  job:
    name: main
    chdir: true
    override_dirname: +wandb.offline=True,algo=mdlm,data.cache_dir=/root/autodl-tmp/data_cache/gsm8k_dev,data.data_path=/root/autodl-tmp/data/gsm8k_dev.json,data.tokenizer_name_or_path=HuggingFaceTB/SmolLM-135M,data=gsm8k-test,eval.checkpoint_path=/root/autodl-tmp/sft_ckpt/1030-sft-v1b-lr3e-5/epoch3.ckpt,gsm8k.bootstrap_size=1000,gsm8k.output_dir=/root/autodl-tmp/dllm/runs/1030-eval-sft-v1b-lr3e-5-e3-s512-T0.1,loader.eval_batch_size=200,loader.num_workers=4,mode=gsm8k_eval,model.length=512,model=small,sampler.skip_unchanged=true,sampler.steps=512,sampler.temperature=0.1,sampler=fast_ancestral,seed=1,trainer.devices=1,trainer.num_nodes=1
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /root/autodl-tmp/dllm/code
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/autodl-tmp/dllm/code/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/autodl-tmp/dllm/runs/1030-eval-sft-v1b-lr3e-5-e3-s512-T0.1/hydra
    choices:
      sampler: fast_ancestral
      algo: mdlm
      prior: none
      lr_scheduler: constant_warmup
      noise: log-linear
      strategy: ddp
      model: small
      data: gsm8k-test
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
